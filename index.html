<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卡片模板工坊</title><link rel="stylesheet" href="assets/studio.css"></head><body><header class="top"><h1>卡片模板工坊</h1></header><main id="home" class="home"><div class="directoryActions"><button id="importProject">导入项目</button></div><div class="templates"><article class="tile"><div class="thumb art" aria-hidden="true"><div class="sample"><div class="photo"></div><b>NAME</b><small>HONKAI: STAR RAIL</small></div><div class="sample back"></div></div><div class="tileBody"><h2>仿卡片拍立得</h2><button class="enter" data-open="polaroid">开始制作<span aria-hidden="true">→</span></button></div></article><article class="tile"><div class="thumb art art2" aria-hidden="true"><div class="sample custom"><div class="photo"></div><b>NAME</b><small>HONKAI: STAR RAIL</small><span class="star">✦</span></div></div><div class="tileBody"><h2>自定义透明卡片</h2><button class="enter" data-open="card">开始制作<span aria-hidden="true">→</span></button></div></article><article class="tile"><div class="thumb art" aria-hidden="true"><div class="storageSketch"><div class="picture"></div></div><div class="storageSketch backStorage"><div class="contacts"></div></div></div><div class="tileBody"><h2>仿存储卡挂件</h2><button class="enter" data-open="storage">开始制作<span aria-hidden="true">→</span></button></div></article><div class="empty" aria-hidden="true"></div></div></main><input id="unifiedProjectFile" type="file" accept=".json,application/json" hidden><section id="editor" class="editor" hidden><nav class="toolbar"><div class="left"><button id="goHome" class="backBtn">← 模板目录</button><span id="toolName" class="toolName"></span><button id="projectMenu" class="projectAction">项目</button><div class="historyActions"><button id="undoProject" title="撤回 Ctrl+Z" disabled aria-label="撤回">↶</button><button id="redoProject" title="重做 Ctrl+Y" disabled aria-label="重做">↷</button></div></div><div class="toolbarRight"><button id="saveProject" class="projectAction" hidden>保存项目</button><button id="openProject" class="projectAction" hidden>打开项目</button><div class="titleZoom"><label id="titleGuidesLabel" class="titleGuides" hidden><input id="titleGuides" type="checkbox" checked>显示参考线</label><button id="titleSize" class="titleSize" type="button">尺寸</button><label>预览</label><input id="titleZoomRange" type="range" min="20" max="500" value="100" aria-label="预览缩放"><input id="titleZoomNumber" type="number" min="20" max="500" value="100" aria-label="预览缩放百分比"><span>%</span><button id="titleFit">适应屏幕</button></div><button id="fullscreenBtn" class="fullscreenBtn">⛶ 全屏编辑</button><select class="quick" id="switchTool" aria-label="切换模板"><option value="polaroid">仿卡片拍立得</option><option value="card">自定义透明卡片</option><option value="storage">仿存储卡挂件</option></select></div></nav><div id="frames" class="framearea"></div></section><footer class="footer">感谢使用本网页工具，优化建议及bug反馈请联系bilibili @陈新粒</footer><script src="assets/studio.js"></script></body></html>
